# ADAPT-Agent declarative training config for a Magentic team.
#
# This is a real-world TEMPLATE: point `entrypoint`/`components` at YOUR own
# importable module, then run it directly:
#
#     from adapt_agent.optimization.config import run_training
#     result = run_training("examples/microsoft_agent_framework/magentic.train.yaml")
#
# (Do not point a checked-in config at an example module or an example-registered
# provider — those only exist while that example runs. Use a real importable
# module path and a built-in provider, as below.
# `04_magentic_team_and_training.py` Part D shows the equivalent run in-process.)
#
# As shipped it is offline-friendly: the deterministic `exact_match` metric and
# NO judge, so it needs no API key. Uncomment the `judge:` block for an
# LLM-as-judge run (and new-tool/skill suggestions).

target:
  # A callable input -> output that drives the whole team (the workflow agent),
  # e.g. a `run` that builds the Magentic workflow and calls
  # `workflow.as_agent(...).run(question)`.
  entrypoint: "myapp.team:run"
  # The five live ChatAgents to introspect for tunable knobs (prompts/models/
  # tools/skills). They are the SAME objects the entrypoint runs, so applying a
  # candidate config changes the next run.
  components:
    researcher: "myapp.team:researcher"
    writer:     "myapp.team:writer"
    coder:      "myapp.team:coder"
    reviewer:   "myapp.team:reviewer"
    manager:    "myapp.team:manager"
  name: research-team

dataset:
  path: "golden.jsonl"        # input/expected per row; paths are relative to CWD
  format: jsonl

metrics: [exact_match]        # deterministic, offline (no model/network)
primary_metric: exact_match

optimizer:
  type: default               # few-shot -> prompts -> models/hparams/routing -> tools
  max_evals: 40
  min_improvement: 0.001
  seed: 0
  suggest_tools: false        # no judge here, so no new-tool suggestions

# Knobs no framework auto-exposes: the Magentic routing limits are not on an
# agent attribute, so declare them explicitly. The YAML's generic setter only
# WRITES the attribute (e.g. `manager.max_round_count`); for that to change
# behaviour your `entrypoint` (`run`) must REBUILD the Magentic workflow from
# these attributes on every call -- the example's `run` does exactly that.
# (Alternatively, bind them to a config object whose property setter rebuilds the
# workflow.) Without one of these, the optimizer would score routing candidates
# that never actually take effect.
parameters:
  - name: manager.max_round_count
    kind: routing
    component: manager
    attr: max_round_count
    bounds: [4, 10]
    step: 1
  - name: manager.max_stall_count
    kind: routing
    component: manager
    attr: max_stall_count
    bounds: [1, 5]
    step: 1

# --- Real (online) judge: uncomment and set provider credentials ------------ #
# judge:
#   provider: anthropic        # anthropic | openai | gemini | mistral | ...
#   model: claude-opus-4-8
#   adversarial: true          # grade as a harsh critic; propose new tools/skills
#   metric_name: quality
# primary_metric: quality
# optimizer:
#   type: default
#   suggest_tools: true        # let the judge propose NEW tools/skills from failures
