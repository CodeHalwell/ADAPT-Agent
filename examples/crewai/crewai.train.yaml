# ADAPT-Agent declarative training config for a CrewAI crew.
#
# This is a real-world TEMPLATE: point `entrypoint`/`components` at YOUR own
# importable module, then run it directly:
#
#     from adapt_agent.optimization.config import run_training
#     result = run_training("examples/crewai/crewai.train.yaml")
#
# or via the CLI:
#
#     adapt-agent train examples/crewai/crewai.train.yaml
#
# (Do not point a checked-in config at an example module or an example-registered
# provider like "stub" — those only exist while that example runs. Use a real
# importable module path and a built-in provider, as below.
# `examples/crewai/04_multi_agent_and_training.py` Part C shows the equivalent
# run built in-process.)
#
# As shipped it is offline-friendly: deterministic `exact_match`/`token_f1`
# metrics and NO judge, so it needs no API key. Uncomment the `judge:` block to
# optimize with an LLM-as-judge (and enable new-tool suggestions).

target:
  # A callable `input -> output` that drives the whole crew, e.g. a `run`
  # function that calls `crew.kickoff(...)` and returns the result text.
  entrypoint: "myapp.crew:run"
  # The live components to introspect for tunable knobs. The CrewAI introspector
  # walks the Crew and exposes per-agent role/goal/backstory, llm model+temp+
  # max_tokens, tools, max_iter, and per-task description/expected_output.
  components:
    crew: "myapp.crew:crew"
  name: research-crew

dataset:
  path: "golden.jsonl"        # input/expected per row; paths are relative to CWD
  format: jsonl

metrics: [exact_match, token_f1]   # deterministic, offline (no model/network)
primary_metric: exact_match

optimizer:
  type: default               # few-shot -> prompts -> models/hparams -> tools/skills
  max_evals: 20
  min_improvement: 0.001
  seed: 0
  suggest_tools: false        # no judge here, so no new-tool suggestions

# No explicit `parameters` block is needed: the CrewAI introspector walks the
# live crew and auto-discovers every per-agent prompt (role/goal/backstory), the
# llm model/temperature/max_tokens, the tools allow-list, max_iter, and each
# task's description/expected_output. To add a knob the framework does NOT expose
# (e.g. a routing threshold on a plain object), declare it with a component (one
# listed under target.components) + a getattr-able dotted `attr_path`:
#
#   parameters:
#     - name: cfg.threshold
#       kind: routing
#       component: cfg
#       attr_path: threshold
#       bounds: [0.0, 1.0]
#       step: 0.1

# --- Real (online) judge: uncomment and set provider credentials ------------ #
# judge:
#   provider: anthropic        # anthropic | openai | gemini | mistral | ...
#   model: claude-opus-4-8
#   adversarial: true          # grade as a harsh critic; propose new tools/skills
#   metric_name: quality
#   pass_threshold: 0.6
# primary_metric: quality
# optimizer:
#   type: default
#   suggest_tools: true        # let the judge propose NEW tools/skills from failures
