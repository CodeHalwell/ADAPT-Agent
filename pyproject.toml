[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adapt-agent"
version = "0.2.0"
description = "ADAPT-Agent: Adversarial Defense & Policy Training for LLM Agents - A comprehensive library for LLM agent optimization and security"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Daniel Halwell", email = "danielhalwell@gmail.com"},
]
maintainers = [
    {name = "Daniel Halwell", email = "danielhalwell@gmail.com"},
]
keywords = [
    "llm",
    "agents",
    "security",
    "optimization",
    "adversarial",
    "policy",
    "trust",
    "ai-safety",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "typing-extensions>=4.5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "build>=1.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]
langgraph = [
    "langgraph>=0.2.0",
]
microsoft-agent-framework = [
    "agent-framework>=1.0.0",
]
google-adk = [
    "google-adk>=0.1.0",
]
pydantic-ai = [
    "pydantic-ai>=0.0.14",
]
crewai = [
    "crewai>=0.40.0",
]
openai-agents = [
    "openai-agents>=0.0.1",
]
claude-agent = [
    "claude-agent-sdk>=0.0.1",
]
all = [
    "adapt-agent[langgraph,microsoft-agent-framework,google-adk,pydantic-ai,crewai,openai-agents,claude-agent]",
]

[project.urls]
Homepage = "https://github.com/CodeHalwell/ADAPT-Agent"
Repository = "https://github.com/CodeHalwell/ADAPT-Agent"
Documentation = "https://github.com/CodeHalwell/ADAPT-Agent/tree/main/docs"
Changelog = "https://github.com/CodeHalwell/ADAPT-Agent/blob/main/CHANGELOG.md"
Issues = "https://github.com/CodeHalwell/ADAPT-Agent/issues"

[project.scripts]
adapt-agent = "adapt_agent.cli:main"

[tool.setuptools.packages.find]
include = ["adapt_agent*"]

[tool.setuptools.package-data]
adapt_agent = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by black)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "agent_framework.*",
    "google.adk.*",
    "google.genai.*",
    "pydantic_ai.*",
    "crewai.*",
    "agents.*",
    "claude_agent_sdk.*",
    # Optional LLM-provider SDKs (imported lazily by adapt_agent.optimization.providers)
    "anthropic",
    "anthropic.*",
    "openai",
    "openai.*",
    "google",
    "google.*",
    "google.generativeai",
    "google.generativeai.*",
    "mistralai",
    "mistralai.*",
    "cohere",
    "cohere.*",
    "boto3",
    "boto3.*",
    "huggingface_hub",
    "huggingface_hub.*",
    # PyYAML ships no type stubs in this project's pinned set
    "yaml",
    "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=adapt_agent --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["adapt_agent"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
