name: Release

# Publishes adapt-agent to PyPI, two ways:
#
#   1. Merge a commit to `main` that bumps `adapt_agent.__version__`. The
#      pipeline notices the version is not on PyPI yet and releases it,
#      creating the `vX.Y.Z` tag itself.
#   2. Push a version tag by hand, as before:
#        git tag -a v0.2.0 -m "v0.2.0" && git push origin v0.2.0
#
# Either way the `pypi` environment's required reviewer still has to approve
# before anything is uploaded -- "automatic" here means no tag ceremony, not
# no human.
#
# Whether to release is decided by asking PyPI whether the version already
# exists, not by diffing against the previous commit: that answer is correct
# for a revert, a re-run, a merge commit, and a hand-pushed tag alike, and it
# is the same index the upload would go to. If PyPI cannot be reached the
# answer is "do not publish" -- a missed release is recoverable and a wrong
# one is not.
#
# Building and publishing are done with uv (`uv build` / `uv publish`).
# Authentication uses PyPI Trusted Publishing (OIDC) -- there is no API token
# stored in this repository. The one-time PyPI setup is documented in
# docs/releasing.md; without it the publish step fails with an auth error.
#
# `workflow_dispatch` runs the same pipeline against TestPyPI (or PyPI) so the
# whole path can be rehearsed before cutting a real release.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

# Least privilege by default; jobs opt in to what they need.
permissions:
  contents: read

# Never let two releases race to the same index. Keyed on the workflow rather
# than the ref: two commits landing on main in quick succession are different
# refs but the same release, and they must not both try to upload it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 1. The tag must agree with the version the package will actually report.
  #    Catches the classic "tagged v0.3.0, shipped 0.2.0" mistake before a
  #    single artifact is built.
  version:
    name: Resolve version and decide whether to release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      tag: ${{ steps.resolve.outputs.tag }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve and verify version
        id: resolve
        run: |
          set -euo pipefail
          # Read __version__ without importing the package (no deps needed).
          package_version="$(python3 -c "
          import pathlib, re
          source = pathlib.Path('adapt_agent/__init__.py').read_text(encoding='utf-8')
          match = re.search(r'^__version__\s*=\s*[\"\x27]([^\"\x27]+)[\"\x27]', source, re.M)
          if match is None:
              raise SystemExit('could not find __version__ in adapt_agent/__init__.py')
          print(match.group(1))
          ")"
          echo "Package version: ${package_version}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            echo "Tag version:     ${tag_version}"
            if [ "${tag_version}" != "${package_version}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match adapt_agent.__version__ (${package_version}). Bump __version__ or retag."
              exit 1
            fi
          else
            echo "Manual run: publishing version ${package_version} without a tag."
          fi

          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${package_version}" >> "$GITHUB_OUTPUT"
          # PEP 440 pre-release segments mark the GitHub Release as a pre-release.
          if printf '%s' "${package_version}" | grep -Eq '(a|b|rc|dev)[0-9]*$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          # Is there anything to release? A hand-pushed tag and a manual run
          # both say so explicitly. A push to main has to be asked, because
          # most commits do not bump the version -- and the authority on
          # "already released" is the index the upload would go to, not a diff
          # against the previous commit, which gets reverts, re-runs and merge
          # commits wrong.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          url="https://pypi.org/pypi/adapt-agent/${package_version}/json"
          # `|| true` rather than `|| echo 000`: curl already writes 000 to
          # stdout when it never got a response, so the echo *appends* a second
          # one and the status reads "000000". Harmless -- it falls to the
          # catch-all either way -- but it would print that in the warning.
          # The `||` itself is load-bearing under `set -e`, which would
          # otherwise abort on curl's non-zero exit.
          status="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 \
                      --max-time 30 "${url}" || true)"
          case "${status}" in
            404)
              echo "PyPI has no ${package_version}; releasing it."
              echo "release=true" >> "$GITHUB_OUTPUT"
              ;;
            200)
              echo "adapt-agent ${package_version} is already on PyPI; nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # Fail closed. Not knowing is not the same as knowing it is new,
              # and a PyPI filename can never be reused.
              echo "::warning::PyPI returned ${status} for ${url}; not releasing."
              echo "release=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  # 2. Gate the release on exactly the checks that guard main (lint, the
  #    3.10-3.14 test matrix, and a build smoke test) by reusing ci.yml.
  ci:
    name: CI
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # 3. Build once, validate hard, and publish that exact artifact.
  build:
    name: Build and validate distributions
    needs: [version, ci]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # --no-sources ignores any tool.uv.sources overrides, so this builds the
      # package exactly as a consumer installing from the index would get it.
      - name: Build sdist and wheel
        run: uv build --no-sources

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Verify the artifacts contain what they must
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import glob, os, sys, tarfile, zipfile

          expected = os.environ["EXPECTED_VERSION"]
          problems = []

          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          if len(wheels) != 1 or len(sdists) != 1:
              sys.exit(f"expected exactly one wheel and one sdist, got {wheels + sdists}")
          wheel, sdist = wheels[0], sdists[0]

          # The built filename is the authoritative version that will be published.
          if f"-{expected}-" not in os.path.basename(wheel):
              problems.append(f"wheel {os.path.basename(wheel)} is not version {expected}")
          if f"-{expected}.tar.gz" not in os.path.basename(sdist):
              problems.append(f"sdist {os.path.basename(sdist)} is not version {expected}")

          names = zipfile.ZipFile(wheel).namelist()

          # The bundled agent skill is package *data*: a packaging slip would
          # silently ship a wheel where `adapt install skill` has nothing to
          # install, so assert it is really in there.
          skill_files = [n for n in names if n.startswith("adapt_agent/skills/") and n.endswith(".md")]
          if not any(n.endswith("/SKILL.md") for n in skill_files):
              problems.append("wheel contains no SKILL.md")
          if not any("/references/" in n for n in skill_files):
              problems.append("wheel contains no skill reference files")

          # Typing marker and both console scripts.
          if "adapt_agent/py.typed" not in names:
              problems.append("wheel is missing py.typed")
          entry_points = [n for n in names if n.endswith("entry_points.txt")]
          if not entry_points:
              problems.append("wheel declares no entry points")
          else:
              scripts = zipfile.ZipFile(wheel).read(entry_points[0]).decode()
              for script in ("adapt =", "adapt-agent ="):
                  if script not in scripts:
                      problems.append(f"wheel is missing the '{script.split()[0]}' console script")

          # The sdist must be able to rebuild the wheel, so it needs the skill too.
          sdist_names = tarfile.open(sdist).getnames()
          if not any(n.endswith("/SKILL.md") for n in sdist_names):
              problems.append("sdist contains no SKILL.md")

          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)

          print(f"OK: {os.path.basename(wheel)} and {os.path.basename(sdist)} look publishable")
          print(f"    skill files: {len(skill_files)}")
          PY

      - name: Smoke-test the wheel in a clean environment
        run: |
          set -euo pipefail
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install --quiet dist/*.whl
          # Both console scripts resolve, and the version they report matches.
          /tmp/smoke/bin/adapt --version
          /tmp/smoke/bin/adapt-agent --version
          # The headline flow from the README works from a bare install.
          workdir="$(mktemp -d)"
          cd "$workdir"
          /tmp/smoke/bin/adapt install skill
          test -f .claude/skills/adapt-agent/SKILL.md
          test -f .claude/skills/adapt-agent/references/evals.md
          echo "Smoke test passed: skill installs from a clean wheel install."

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # 4a. Manual rehearsal against TestPyPI. The `testpypi` publish target is
  #     defined under [[tool.uv.index]] in pyproject.toml, hence the checkout.
  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: [version, build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/adapt-agent
    permissions:
      id-token: write # Trusted Publishing (OIDC); no API token needed.
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        run: |
          uv publish \
            --index testpypi \
            --trusted-publishing always \
            --check-url https://test.pypi.org/simple/

  # 4b. The real thing: a pushed v* tag (or an explicit manual choice).
  publish-pypi:
    name: Publish to PyPI
    # NOT `github.event_name == 'push'`: that is true for a push to *any*
    # branch, so with `main` among the triggers it would attempt a publish on
    # every commit. The gate is what says a release is wanted; the event only
    # says which index a manual run picked.
    if: >-
      needs.version.outputs.release == 'true'
      && (github.event_name != 'workflow_dispatch' || inputs.target == 'pypi')
    needs: [version, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/adapt-agent
    permissions:
      id-token: write # Trusted Publishing (OIDC); no API token needed.
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # `--trusted-publishing always` fails loudly if OIDC is unavailable
      # rather than silently falling back to an anonymous upload attempt.
      # `--check-url` makes a re-run skip files already on the index.
      - name: Publish
        run: |
          uv publish \
            --trusted-publishing always \
            --check-url https://pypi.org/simple/

  # 5. Record the release on GitHub with the same artifacts that went to PyPI.
  github-release:
    name: Create GitHub Release
    # Also creates the tag when the release came from a version bump rather
    # than a hand-pushed tag, which is why it runs *after* the upload: the tag
    # then always means "this is on PyPI", with no window where one exists
    # without the other.
    #
    # A tag created here with the default GITHUB_TOKEN does not trigger another
    # workflow run -- GitHub's recursion guard -- which is exactly why this run
    # publishes rather than tagging and expecting to be re-entered.
    if: github.event_name == 'push' && needs.version.outputs.release == 'true'
    needs: [version, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v7

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          # The version's own tag, never `github.ref_name`: on a push to main
          # that is the branch, and this would cut a release called "main".
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # --target pins the tag to the commit that was built and published,
          # and is a no-op when the tag already exists from a manual push.
          flags=(--generate-notes --title "$TAG" --target "$GITHUB_SHA")
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" dist/* "${flags[@]}"
