name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Callable from release.yml, so a tagged release is gated on exactly the
  # same lint, test-matrix and build checks that guard main.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Black check
        run: black --check .
      - name: Mypy
        run: mypy adapt_agent
      # A retired or typo'd action ref fails a run before any step executes.
      # release.yml only runs on a tag, so without this the discovery happens
      # after cutting one. Checked here, and on the tag path via workflow_call.
      - name: Check workflow action refs resolve
        run: python3 scripts/check_action_refs.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest --cov=adapt_agent --cov-report=xml --cov-report=term-missing --cov-fail-under=85
      - name: Upload coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build distributions
        run: python -m build
      - name: Install wheel and smoke-test import
        run: |
          python -m pip install dist/*.whl
          python -c "import adapt_agent; print(adapt_agent.__version__)"
